mixed-port: 7890
allow-lan: true
mode: "rule"
log-level: "info"
ipv6: false
proxy-providers:
  BS-SAFE-MANUAL:
    type: "http"
    url: "https://markkikhtenko.github.io/pale-signal/subscription-bs-safe-manual.yaml"
    path: "./proxy_provider/pale-signal-bs-safe-manual.yaml"
    interval: 43200
    proxy: "DIRECT"
  BS-SAFE-AUTO:
    type: "http"
    url: "https://markkikhtenko.github.io/pale-signal/subscription-bs-safe-auto.yaml"
    path: "./proxy_provider/pale-signal-bs-safe-auto.yaml"
    interval: 43200
    proxy: "DIRECT"
proxy-groups:
  -
    name: "AUTO"
    type: "url-test"
    use:
      - "BS-SAFE-AUTO"
    url: "https://www.gstatic.com/generate_204"
    interval: 3600
    tolerance: 100
    lazy: true
  -
    name: "MANUAL"
    type: "select"
    use:
      - "BS-SAFE-MANUAL"
  -
    name: "PROXY"
    type: "select"
    proxies:
      - "MANUAL"
      - "AUTO"
rules:
  - "MATCH,PROXY"
