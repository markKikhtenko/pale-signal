mixed-port: 7890
allow-lan: true
mode: "rule"
log-level: "info"
ipv6: false
proxies:
  -
    name: "🇦🇹 Austria [*CIDR]"
    type: "vless"
    server: "185.244.182.162"
    port: 443
    uuid: "c50eae6b-18de-4bdc-a22f-9edda40a57ed"
    network: "xhttp"
    udp: true
    encryption: "none"
    tls: true
    servername: "atd1.tunnely.space"
    client-fingerprint: "firefox"
    alpn:
      - "h2"
      - "http/1.1"
    xhttp-opts:
      path: "/xhttp/"
      mode: "packet-up"
  -
    name: "🇩🇪 Germany — #51"
    type: "vless"
    server: "185.178.208.167"
    port: 443
    uuid: "6bd1d88f-0a26-4d21-b325-15d85120b883"
    network: "ws"
    udp: true
    encryption: "none"
    tls: true
    servername: "sw-api.telemetryapi.org"
    client-fingerprint: "edge"
    ws-opts:
      path: "/api/v2/client/session/connect"
      headers:
        Host: "sw-api.telemetryapi.org"
  -
    name: "🇩🇪 Germany [*CIDR] t.me/rjsxrd 7"
    type: "vless"
    server: "sw-api.telemetryapi.org"
    port: 443
    uuid: "6bd1d88f-0a26-4d21-b325-15d85120b883"
    network: "ws"
    udp: true
    encryption: "none"
    tls: true
    servername: "sw-api.telemetryapi.org"
    client-fingerprint: "edge"
    alpn:
      - "http%2F1.1"
    ws-opts:
      path: "/api/v2/client/session/connect"
proxy-groups:
  -
    name: "AUTO"
    type: "url-test"
    proxies:
      - "🇦🇹 Austria [*CIDR]"
      - "🇩🇪 Germany — #51"
      - "🇩🇪 Germany [*CIDR] t.me/rjsxrd 7"
    url: "https://cp.cloudflare.com/generate_204"
    interval: 900
    tolerance: 100
    lazy: true
  -
    name: "MANUAL"
    type: "select"
    proxies:
      - "🇦🇹 Austria [*CIDR]"
      - "🇩🇪 Germany — #51"
      - "🇩🇪 Germany [*CIDR] t.me/rjsxrd 7"
  -
    name: "PROXY"
    type: "select"
    proxies:
      - "AUTO"
      - "MANUAL"
rules:
  - "MATCH,PROXY"
