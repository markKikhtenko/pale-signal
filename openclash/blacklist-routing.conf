# Pale Signal: DIRECT by default, blocked resources through PROXY.
# Requires OpenClash >= 0.47.081 and a Mihomo/Meta core.

[General]
CORE_TYPE = Meta
PROXY_MODE = rule
ENABLE_REDIRECT_DNS = 1
ENABLE_RESPECT_RULES = 1
RESTART = true

[YAML]
rule-providers:
  pale-signal-custom-direct-domain:
    type: http
    behavior: domain
    format: yaml
    url: "https://markkikhtenko.github.io/pale-signal/openclash/rules/custom-direct-domains.yaml"
    path: ./rule_provider/pale-signal/custom-direct-domains.yaml
    interval: 3600
    proxy: DIRECT
  pale-signal-custom-proxy-domain:
    type: http
    behavior: domain
    format: yaml
    url: "https://markkikhtenko.github.io/pale-signal/openclash/rules/custom-proxy-domains.yaml"
    path: ./rule_provider/pale-signal/custom-proxy-domains.yaml
    interval: 3600
    proxy: DIRECT
  pale-signal-refilter-community-domain:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/community.lst"
    path: ./rule_provider/pale-signal/refilter-community-domain.txt
    interval: 21600
    proxy: DIRECT
  pale-signal-refilter-domain:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst"
    path: ./rule_provider/pale-signal/refilter-domain.txt
    interval: 21600
    proxy: DIRECT
  pale-signal-custom-direct-ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: "https://markkikhtenko.github.io/pale-signal/openclash/rules/custom-direct-ip.yaml"
    path: ./rule_provider/pale-signal/custom-direct-ip.yaml
    interval: 3600
    proxy: DIRECT
  pale-signal-custom-proxy-ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: "https://markkikhtenko.github.io/pale-signal/openclash/rules/custom-proxy-ip.yaml"
    path: ./rule_provider/pale-signal/custom-proxy-ip.yaml
    interval: 3600
    proxy: DIRECT
  pale-signal-refilter-community-ip:
    type: http
    behavior: ipcidr
    format: text
    url: "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/community_ips.lst"
    path: ./rule_provider/pale-signal/refilter-community-ip.txt
    interval: 21600
    proxy: DIRECT
  pale-signal-refilter-discord-ip:
    type: http
    behavior: ipcidr
    format: text
    url: "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/discord_ips.lst"
    path: ./rule_provider/pale-signal/refilter-discord-ip.txt
    interval: 21600
    proxy: DIRECT
  pale-signal-refilter-ip:
    type: http
    behavior: ipcidr
    format: text
    url: "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/ipsum.lst"
    path: ./rule_provider/pale-signal/refilter-ip.txt
    interval: 21600
    proxy: DIRECT

# Remove every existing catch-all first. Existing specific rules stay in place
# and therefore keep their priority over this independent routing module.
rules*:
  where:
    value: '/^MATCH,.*$/'
  set:
    value:

# Append the module after existing specific rules and restore one final catch-all.
rules+:
  - RULE-SET,pale-signal-custom-direct-domain,DIRECT
  - RULE-SET,pale-signal-custom-proxy-domain,PROXY
  - RULE-SET,pale-signal-refilter-community-domain,PROXY
  - RULE-SET,pale-signal-refilter-domain,PROXY
  - RULE-SET,pale-signal-custom-direct-ip,DIRECT,no-resolve
  - RULE-SET,pale-signal-custom-proxy-ip,PROXY
  - RULE-SET,pale-signal-refilter-community-ip,PROXY
  - RULE-SET,pale-signal-refilter-discord-ip,PROXY
  - RULE-SET,pale-signal-refilter-ip,PROXY
  - MATCH,DIRECT
