# ============================================================
# Pale Signal - OpenClash Whitelist Routing Subscription
# Version: 2026.11.21-1
# Created: 2026-11-21T00:00:00+03:00
# Maintainer: markKikhtenko
# Scope: whitelist-restriction (BS) router with Huawei/MegaFon DNS
# Changes: Publish the preserved local custom overwrite as a web module
# ============================================================
# This module replaces /etc/openclash/custom/openclash_custom_overwrite.sh.
# Do not enable it on routers that use another custom overwrite script.
# Do not combine it with blacklist-routing*.conf on the same profile.
# The existing routing modules and their rule providers are not modified.

[General]
CORE_TYPE = Meta
PROXY_MODE = rule
RESTART = true
DOWNLOAD_FILE = url=https://markkikhtenko.github.io/pale-signal/openclash/whitelist-routing.sh, path=/etc/openclash/custom/openclash_custom_overwrite.sh, force=true
